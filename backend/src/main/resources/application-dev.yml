spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartqueue}
    username: ${DB_USERNAME:smartqueue}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

smartqueue:
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-only-secret-change-before-deployment-123456789}
      expiration: 15m
      qr-expiration: 5m
      refresh-expiration: 7d
      refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}

logging:
  level:
    com.smartqueue: DEBUG
