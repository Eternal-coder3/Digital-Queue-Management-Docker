spring:
  application:
    name: smartqueue
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.smartqueue: INFO

management:
  server:
    port: ${MANAGEMENT_PORT:${SERVER_PORT:8080}}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: SmartQueue
    version: 0.1.0

smartqueue:
  auth:
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:8080/reset-password}
  websocket:
    # Comma-separated origins permitted to open live queue WebSocket connections.
    # Set SMARTQUEUE_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS to your exact LAN address in a shared environment.
    allowed-origin-patterns: ${SMARTQUEUE_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*}
  queue:
    key-prefix: smartqueue:queue
    ttl: 36h

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:5050}
